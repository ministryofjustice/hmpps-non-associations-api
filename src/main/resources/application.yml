info.app:
  name: HMPPS Non-associations API
  version: 1.0

spring:
  application:
    name: hmpps-non-associations-api
  main:
    web-application-type: servlet
  http:
    codecs:
      max-in-memory-size: 10MB

  security:
    oauth2:
      resource-server:
        jwt:
          jwk-set-uri: ${api.base.url.oauth}/.well-known/jwks.json

      client:
        registration:
          NON_ASSOCIATIONS_API:
            provider: hmpps-auth
            client-id: ${non_associations.api.client.id}
            client-secret: ${non_associations.api.client.secret}
            authorization-grant-type: client_credentials
        provider:
          hmpps-auth:
            token-uri: ${api.base.url.oauth}/oauth/token

  jackson:
    time-zone: "Europe/London"

  profiles:
    group:
      dev:
        - "localstack"
      test:
        - "localstack"
        - "stdout"
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

  datasource:
    url: 'jdbc:postgresql://${DATABASE_ENDPOINT}/${DATABASE_NAME}?sslmode=verify-full'
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: NON-DB-CP
      maximum-pool-size: 20
      max-lifetime: 600000
      connection-timeout: 1000
      validation-timeout: 500

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|100\.6[4-9]\.\d{1,3}\.\d{1,3}|100\.[7-9][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]\.\d{1,3}\.\d{1,3}
  shutdown: graceful
  error:
    include-message: always

hmpps:
  sqs:
    queueAdminRole: ROLE_NON_ASSOCIATIONS_API_QUEUE_ADMIN

# The subject access request report template. Enabled here rather than only in helm so that every profile,
# including the one the tests run under, validates the path on startup - the library resolves it as a
# classpath resource in a @PostConstruct and fails to start if it is wrong, and that is far better found in
# CI than in a deploy. The path is overridden per environment in helm so a new template version can be rolled
# out one environment at a time, which is the granularity the SAR tool's register-before-deploy rule needs.
#
# V1 is the template the HAA team held centrally in hmpps-subject-access-request-html-renderer, copied byte for
# byte (IR-2038). The SAR tool recognises a template by its hash, so it must not be edited in place: a change is
# a new version, registered with the SAR tool in each environment before the code that serves it deploys there.
hmpps.sar:
  template:
    enabled: true
    path: ${HMPPS_SAR_TEMPLATE_PATH:/sar/templates/V1__sar_template.mustache}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: 'info, health'
  endpoint:
    health:
      cache:
        time-to-live: 2000ms
      show-components: always
      show-details: always
      probes:
        enabled: true
    info:
      cache:
        time-to-live: 2000ms
